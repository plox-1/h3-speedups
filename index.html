<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniMax H3 speed-ups, measured</title>
<meta name="description" content="Every known way to make MiniMax H3 render faster, re-measured against the raw model on one RTX 5090. New comparison in progress.">
<meta property="og:title" content="MiniMax H3 speed-ups, measured">
<meta property="og:description" content="A new raw-model comparison is being measured: no LoRA baseline, two test shots (5 s and 15 s).">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23262626'/%3E%3Crect x='4' y='6' width='24' height='5' fill='%23f0a63a'/%3E%3Crect x='4' y='13.5' width='19' height='5' fill='%23b9d64a'/%3E%3Crect x='4' y='21' width='13' height='5' fill='%238fa3b8'/%3E%3Crect x='16.5' y='3' width='1' height='26' fill='%23ececec' opacity='.7'/%3E%3C/svg%3E">
<style>
@font-face {
  font-family: "Archivo";
  src: url("fonts/archivo-var-latin.woff2") format("woff2");
  font-weight: 100 900; font-stretch: 62% 125%; font-display: swap;
}
/* Same tokens as the board (research/tools/site_template.html, DESIGN.md): neutral graphite, verdict inks only. */
:root {
  --ground: #262626; --slab: #303030; --rule: #4c4c4c;
  --ink: #ececec; --dim: #b7b7b7; --faint: #9c9c9c;
  --lime: #b9d64a; --pad: clamp(16px, 3vw, 40px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--ground); }
body { margin: 0; color: var(--ink); background: var(--ground); font: 400 15px/1.45 "Archivo", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; }
a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--lime); }
.wrap { max-width: 1480px; margin: 0 auto; padding: clamp(28px, 5vw, 56px) var(--pad) 48px; }
h1 { margin: 0; font-weight: 800; font-stretch: 78%; font-size: clamp(34px, 4.6vw, 62px); line-height: .98;
  letter-spacing: -.015em; text-wrap: balance; }
.status { display: inline-block; margin: 22px 0 0; padding: 4px 10px; border: 1px solid var(--lime); color: var(--lime);
  font-weight: 700; font-stretch: 88%; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.lede { margin: 18px 0 0; max-width: 64ch; color: var(--dim); font-size: 17px; text-wrap: pretty; }
.lede b { color: var(--ink); font-weight: 600; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; margin: 34px 0 0; border-bottom: 1px solid var(--rule); }
.tab { padding: 10px 14px 9px; color: var(--dim); font-weight: 700; font-stretch: 88%; font-size: 18px; }
.tab small { margin-left: 8px; color: var(--faint); font-weight: 400; font-size: 13px; letter-spacing: .02em; }
.facts { margin: 22px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 8px; }
.facts li { padding: 3px 9px; background: var(--slab); color: var(--dim); font-size: 13px; }
.foot { margin: 40px 0 0; color: var(--faint); font-size: 13px; max-width: 70ch; }
</style>
</head>
<body>
<main class="wrap">
  <h1 id="headline"></h1>
  <div class="status">New comparison in progress</div>
  <p class="lede" id="lede"></p>
  <div class="tabs" id="tabs"></div>
  <ul class="facts" id="facts"></ul>
  <p class="foot" id="foot"></p>
</main>
<script>
const DATA = {"headline": "MiniMax H3 speed-ups, measured", "lede": "Every speed-up is being re-measured against the raw model as ComfyUI's official template runs it: <b>no LoRA, 25 steps<\/b>, Comfy Kitchen int8 attention, on one RTX 5090. LoRAs and distillations become candidates like every other method. Each method gets a cold start and a warm render, on two test shots.", "prompts": [{"label": "Samurai in the rain · 5 s"}, {"label": "Night market · 15 s"}], "setup": ["RTX 5090, 32 GB", "1344 x 768", "baseline without LoRA", "25 steps, euler", "Comfy Kitchen int8 attention", "cold start + warm render"], "foot": "The previous board measured everything against a turbo-LoRA baseline. It has been retired; this comparison replaces it.", "goatcounter": "https://pl0x.goatcounter.com/count"};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
$("headline").textContent = DATA.headline;
$("lede").innerHTML = DATA.lede;
$("tabs").innerHTML = DATA.prompts.map(p => `<span class="tab">${esc(p.label)}<small>coming</small></span>`).join("");
$("facts").innerHTML = DATA.setup.map(f => `<li>${esc(f)}</li>`).join("");
$("foot").textContent = DATA.foot + (DATA.goatcounter ? " Visits are counted with GoatCounter: no cookies, nothing personal." : "");
if (DATA.goatcounter) {
  const gc = document.createElement("script");
  gc.async = true; gc.dataset.goatcounter = DATA.goatcounter; gc.src = "js/count.js";
  document.body.appendChild(gc);
}
</script>
</body>
</html>
